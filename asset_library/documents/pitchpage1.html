<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta content="width=1280, height=720, initial-scale=1.0" name="viewport" />
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
  <style>
    :root {
      --bg: #080818;
      --bg-card: #13132b;
      --text: #eeeeff;
      --text-muted: #9090b8;
      --accent: #8b5cf6;
      --cyan: #22d3ee;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 0;
      width: 1280px; height: 720px;
      overflow: hidden;
      font-family: 'Calibri', sans-serif;
      background: var(--bg);
      color: var(--text);
      position: relative;
    }
    h1, h2, h3, h4, h5, h6 {
      color: var(--text);
      font-family: 'Calibri Light', sans-serif;
    }

    /* ── Deep-space starfield ── */
    .starfield {
      position: absolute;
      inset: 0;
      overflow: hidden;
      z-index: 0;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: #fff;
      opacity: 0;
      animation: twinkle var(--d, 4s) ease-in-out var(--delay, 0s) infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0; }
      50% { opacity: var(--op, 0.6); }
    }

    /* ── Neural web SVG ── */
    .neural-web {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    /* ── Radial ambient glow behind center ── */
    .center-glow {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 520px; height: 520px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(139,92,246,0.18) 0%, rgba(34,211,238,0.07) 40%, transparent 70%);
      z-index: 2;
      pointer-events: none;
    }

    /* ── Vignette edges ── */
    .vignette {
      position: absolute;
      inset: 0;
      z-index: 3;
      background: radial-gradient(ellipse at center, transparent 38%, rgba(8,8,24,0.55) 70%, rgba(8,8,24,0.92) 100%);
      pointer-events: none;
    }

    /* ── Content layer ── */
    .content {
      position: absolute;
      inset: 0;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    /* ── Logotype chip ── */
    .orb-chip {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }
    .orb-chip-icon {
      width: 36px; height: 36px;
      border-radius: 50%;
      background: conic-gradient(from 120deg, #8b5cf6, #22d3ee, #8b5cf6);
      box-shadow: 0 0 18px rgba(139,92,246,0.7), 0 0 38px rgba(34,211,238,0.3);
      flex-shrink: 0;
    }
    .orb-chip-label {
      font-family: 'Calibri Light', sans-serif;
      font-size: 13px;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--text-muted);
    }

    /* ── Company name ── */
    .company-name {
      font-family: 'Calibri Light', sans-serif;
      font-size: 96px;
      font-weight: 300;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      line-height: 1;
      text-align: center;
      background: linear-gradient(135deg, #c4b5fd 0%, #8b5cf6 40%, #22d3ee 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 0 28px rgba(139,92,246,0.65)) drop-shadow(0 0 60px rgba(139,92,246,0.25));
      margin-bottom: 10px;
    }

    /* ── Divider line ── */
    .divider {
      width: 320px;
      height: 1px;
      background: linear-gradient(to right, transparent, #8b5cf6, #22d3ee, transparent);
      margin: 0 auto 22px;
      opacity: 0.7;
    }

    /* ── Tagline ── */
    .tagline-primary {
      font-family: 'Calibri Light', sans-serif;
      font-size: 26px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--text);
      text-align: center;
      margin-bottom: 10px;
    }
    .tagline-secondary {
      font-family: 'Calibri', sans-serif;
      font-size: 16px;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      text-align: center;
    }
    .tagline-secondary span {
      color: #22d3ee;
      opacity: 0.9;
    }

    /* ── Bottom meta bar ── */
    .meta-bar {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      z-index: 11;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      padding: 0 52px 28px;
    }
    .meta-label {
      font-family: 'Calibri', sans-serif;
      font-size: 11px;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--text-muted);
      opacity: 0.65;
    }
    .meta-label .dot-sep {
      margin: 0 6px;
      opacity: 0.4;
    }

    /* ── Node pulse animation ── */
    @keyframes nodePulse {
      0%, 100% { opacity: 0.6; r: 5; }
      50% { opacity: 1; r: 7; }
    }
    @keyframes nodePulseSm {
      0%, 100% { opacity: 0.35; r: 3; }
      50% { opacity: 0.75; r: 4.5; }
    }
    @keyframes lineFlicker {
      0%, 100% { opacity: 0.18; }
      50% { opacity: 0.38; }
    }
    @keyframes cyanFlicker {
      0%, 100% { opacity: 0.22; }
      50% { opacity: 0.5; }
    }
    .node-main { animation: nodePulse 3.2s ease-in-out infinite; }
    .node-sm { animation: nodePulseSm 4.1s ease-in-out infinite; }
    .line-v { animation: lineFlicker 4.5s ease-in-out infinite; }
    .line-c { animation: cyanFlicker 3.8s ease-in-out infinite; }
  </style>
</head>
